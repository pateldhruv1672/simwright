[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "simwright"
version = "0.2.0"
description = "AI copilot for robot simulation: Isaac Sim, Isaac Lab, ROS 2, Gazebo and MuJoCo on Windows, WSL and Docker."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["openai>=1.40", "mcp>=1.10"]

[project.scripts]
simwright = "simwright.cli:main"
simwright-mcp = "simwright.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simwright"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "simwright/_data/skills"
"kit_exts" = "simwright/_data/kit_exts"
"install" = "simwright/_data/install"

[dependency-groups]
dev = ["pytest>=8"]
